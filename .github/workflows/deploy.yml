name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build com pixels injetados
        run: npm run build
        env:
          VITE_META_PIXEL_ID: ${{ secrets.VITE_META_PIXEL_ID }}
          VITE_GA4_ID: ${{ secrets.VITE_GA4_ID }}
          VITE_GADS_ID: ${{ secrets.VITE_GADS_ID }}
          VITE_GADS_LABEL: ${{ secrets.VITE_GADS_LABEL }}
          VITE_CLARITY_ID: ${{ secrets.VITE_CLARITY_ID }}

      # Cache do Chromium do Puppeteer (evita rebaixar ~150MB a cada run)
      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instala Chromium do Puppeteer
        run: npx puppeteer browsers install chrome

      # Gera sitemap (197 URLs indexáveis) e pré-renderiza cada rota em dist/<route>/index.html
      - name: SEO — sitemap + pré-renderização
        run: npm run seo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
