<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BR Aço</title>
  <script>
    // SPA redirect trick for GitHub Pages
    // Converts /path/to/page into /?/path/to/page so index.html can restore it
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host +
      l.pathname.split('/').slice(0, 1).join('/') +
      '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
