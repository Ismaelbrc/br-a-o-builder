<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BR Aço — Solicitar Orçamento</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-16520884957"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-16520884957');
    gtag('config', 'G-YENBSKZW0K');
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container { padding: 2rem; max-width: 360px; }
    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: #e63232;
      letter-spacing: 1px;
      margin-bottom: 2rem;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid #333;
      border-top-color: #25d366;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
    }
    p { color: #888; font-size: 0.875rem; line-height: 1.5; }
    a { color: #25d366; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">BR AÇO</div>
    <div class="spinner"></div>
    <h2>Redirecionando para o WhatsApp...</h2>
    <p>
      Aguarde um momento.<br>
      Caso não seja redirecionado,
      <a id="fallback-link" href="#">clique aqui</a>.
    </p>
  </div>

  <script>
    var phone = '556299247285';
    var text = encodeURIComponent('Olá, vim pelo Google e gostaria de um orçamento de aço.');
    var whatsappUrl = 'https://api.whatsapp.com/send?phone=' + phone + '&text=' + text;

    document.getElementById('fallback-link').href = whatsappUrl;

    function redirect() {
      window.location.href = whatsappUrl;
    }

    function gtag_report_conversion(url) {
      var callback = function() {
        if (typeof url !== 'undefined') {
          window.location.href = url;
        }
      };
      gtag('event', 'conversion', {
        'send_to': 'AW-16520884957/owp-CPWhxbAcEN3l4sU9',
        'event_callback': callback
      });
      return false;
    }

    gtag_report_conversion(whatsappUrl);

    // Fallback: redireciona em 3s se o callback do gtag não disparar
    setTimeout(redirect, 3000);
  </script>
</body>
</html>
