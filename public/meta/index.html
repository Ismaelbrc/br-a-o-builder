<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BR Aço — Instagram</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Meta Pixel -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1952720385143373');
    fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1952720385143373&ev=PageView&noscript=1"/></noscript>

  <!-- GA4 (cross-attribution) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YENBSKZW0K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YENBSKZW0K');
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container { padding: 2rem; max-width: 360px; }
    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: #F97316;
      letter-spacing: 1px;
      margin-bottom: 2rem;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid #333;
      border-top-color: #25d366;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.6rem; }
    p  { color: #888; font-size: 0.875rem; line-height: 1.5; }
    a  { color: #25d366; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">BR AÇO</div>
    <div class="spinner"></div>
    <h2>Redirecionando para o WhatsApp...</h2>
    <p>
      Aguarde um momento.<br>
      Caso não seja redirecionado,
      <a id="fallback-link" href="#">clique aqui</a>.
    </p>
  </div>

  <script>
    var phone = '556299247285';
    var text  = encodeURIComponent('Olá, quero saber mais da BR Aço');
    var whatsappUrl = 'https://api.whatsapp.com/send?phone=' + phone + '&text=' + text;

    document.getElementById('fallback-link').href = whatsappUrl;

    // Dispara conversão Lead no Meta Pixel
    fbq('track', 'Lead', {
      content_name: 'WhatsApp Click',
      content_category: 'meta-ads'
    });

    // GA4 — geração de lead (cross-attribution)
    gtag('event', 'generate_lead', {
      event_category: 'meta-ads',
      event_label: 'whatsapp_meta'
    });

    // Redireciona após 1.5s (tempo para o pixel enviar o evento)
    setTimeout(function() {
      window.location.href = whatsappUrl;
    }, 1500);
  </script>
</body>
</html>
