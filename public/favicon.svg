  <g fill="none" stroke="#FFFFFF" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- Quadro do estribo com abertura no topo -->
    <path d="M13 8 H10 A2.5 2.5 0 0 0 7.5 10.5 V21.5 A2.5 2.5 0 0 0 10 24 H22 A2.5 2.5 0 0 0 24.5 21.5 V10.5 A2.5 2.5 0 0 0 22 8 H19"/>
